services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
    networks:
      - app
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      BIND_HOST: 0.0.0.0
      DB_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Execute node scripts/setup-env.ts}
      MYSQL_USER: ${MYSQL_USER:?Execute node scripts/setup-env.ts}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute node scripts/setup-env.ts}
      JWT_SECRET: ${JWT_SECRET:?Execute node scripts/setup-env.ts}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app
      - data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Execute node scripts/setup-env.ts}
      MYSQL_USER: ${MYSQL_USER:?Execute node scripts/setup-env.ts}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute node scripts/setup-env.ts}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute node scripts/setup-env.ts}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - data
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  app:
  data:
    internal: true
